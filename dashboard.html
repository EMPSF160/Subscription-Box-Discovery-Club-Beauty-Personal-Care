<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard & Subscription Management | GLOWBOX</title>
  <meta name="description" content="Manage your GLOWBOX subscription, customize your upcoming monthly box hero items, review products, and manage billing.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- AOS Animation -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="customerDashboardRoot">

  <!-- Dashboard Top Bar -->
  <nav class="navbar navbar-expand-xl bg-plum border-bottom border-secondary border-opacity-25 py-2">
    <div class="container-fluid px-4">
      <a class="navbar-brand text-white" href="index.html">
        <span class="brand-logo-text text-white fs-4">GLOWBOX<span class="brand-sparkle">✦</span></span>
      </a>

      <button class="navbar-toggler text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#dashTopNav" aria-controls="dashTopNav" aria-expanded="false" aria-label="Toggle navigation">
        <i class="fa-solid fa-bars fs-4 text-white"></i>
      </button>

      <div class="collapse navbar-collapse" id="dashTopNav">
        <div class="d-flex flex-column flex-xl-row align-items-xl-center gap-3 ms-xl-auto mt-3 mt-xl-0">
          <a href="index.html" class="btn btn-sm btn-outline-light">
            <i class="fa-solid fa-store me-1"></i> Store & Explore
          </a>
          <a href="admin.html" class="btn btn-sm btn-glow-champagne">
            <i class="fa-solid fa-gear me-1"></i> Admin Portal
          </a>
          <div class="d-flex align-items-center gap-2 text-white pt-2 pt-xl-0 border-top border-xl-0 border-secondary border-opacity-25">
            <img src="image/stocksnap-face-2573217_1920.jpg" alt="Sophia Montgomery" class="rounded-circle border border-warning" style="width: 38px; height: 38px; object-fit: cover;">
            <span class="small fw-semibold">Sophia M. (VIP)</span>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Dashboard Master Layout -->
  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="dashboard-sidebar">
      <!-- User profile brief -->
      <div class="sidebar-user-card">
        <img src="image/stocksnap-face-2573217_1920.jpg" alt="Sophia" class="sidebar-avatar">
        <div class="overflow-hidden">
          <strong class="d-block text-white text-truncate" style="font-size: 0.95rem;">Sophia Montgomery</strong>
          <span class="badge bg-rose text-plum fw-bold" style="font-size: 0.7rem;">VIP Discovery Member</span>
        </div>
      </div>

      <!-- Navigation Links -->
      <ul class="sidebar-nav">
        <li>
          <a class="sidebar-nav-link active" data-dash-tab="overview">
            <i class="fa-solid fa-house"></i> <span>Overview</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="subscription">
            <i class="fa-solid fa-gem"></i> <span>My Subscription</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="upcoming">
            <i class="fa-solid fa-wand-magic-sparkles"></i> <span>Upcoming Box</span>
            <span class="badge bg-warning text-dark ms-auto" style="font-size: 0.65rem;">Customize</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="products">
            <i class="fa-solid fa-spray-can-sparkles"></i> <span>My Products</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="profile">
            <i class="fa-solid fa-id-card-clip"></i> <span>Beauty Profile</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="orders">
            <i class="fa-solid fa-receipt"></i> <span>Order History</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="favorites">
            <i class="fa-solid fa-heart"></i> <span>Favorites</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="reviews">
            <i class="fa-solid fa-star"></i> <span>Reviews & Points</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="billing">
            <i class="fa-solid fa-credit-card"></i> <span>Billing & Payments</span>
          </a>
        </li>
        <li>
          <a class="sidebar-nav-link" data-dash-tab="settings">
            <i class="fa-solid fa-sliders"></i> <span>Account Settings</span>
          </a>
        </li>
        <li class="mt-auto pt-3 border-top border-secondary border-opacity-25">
          <a href="login.html" class="sidebar-nav-link text-danger">
            <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
          </a>
        </li>
      </ul>
    </aside>

    <!-- Main Content Area -->
    <main class="dashboard-content" id="dashContentArea">
      <!-- Dynamic View Injected by js/dashboard.js -->
    </main>

  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
